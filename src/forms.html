<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formularios</title>
</head>
<body>
    <p>Tipos de campos de una formulario</p>
    <form>
    
        <input type="text" required placeholder="Escribe tu Nombre">
        <input type="email" required placeholder="Escribe tu correo">
        <input type="password" required placeholder="Escribe tu contraseña">
        <input type="checkbox">
        <input type="radio">
        <input type="file">
        <input type="date" >
        <input type="submit">
        <input type="button" value="Click">

    </form>
</body>
</html>
